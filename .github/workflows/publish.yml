name: Publish scheduled posts
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (post nothing)"
        type: boolean
        default: true

concurrency:
  group: publish          # never run two publishers at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_EXPIRES_ON: ${{ secrets.LINKEDIN_TOKEN_EXPIRES_ON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIMEZONE: Asia/Kolkata
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m publisher --dry-run
          else
            python -m publisher
          fi
